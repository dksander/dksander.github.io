title: dksander
description: Blog about code, Business Central/AL, DevOps, and other projects
og_image: /assets/og-image.png
url: "https://dksander.dev"
remote_theme: "mmistakes/minimal-mistakes@4.26.2"
minimal_mistakes_skin: dark
permalink: /:year/:month/:day/:title/
safe: true
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
whitelist:
  - jekyll-remote-theme
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

github_username: dksander

author:
  name: "Lars Sander"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dksander"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/lars-sander-b4727466/"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/dksander"
      new_tab: true
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/lars-sander-b4727466/"
      new_tab: true
    - label: "RSS"
      icon: "fas fa-fw fa-rss-square"
      url: "/feed.xml"
    - label: "Subscribe"
      icon: "fas fa-fw fa-envelope"
      url: "https://follow.it/dksander?leanpub"
      new_tab: true

defaults:
  - scope:
      path: ""
      type: posts
    values:
      show_date: true
      read_time: true

markdown: kramdown
kramdown:
  input: GFM
